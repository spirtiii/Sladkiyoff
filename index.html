<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>SLADKIYOFF — Mobile Tactical FPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Russo+One&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <section id="menu" class="screen">
      <div class="menu-noise"></div><header><span class="eyebrow">MOBILE TACTICAL FPS</span><h1>SLADKIY<span>OFF</span></h1><p>Сенсорный шутер. Тактика решает.</p></header>
      <div class="map-carousel" id="map-carousel"></div>
      <div class="menu-controls"><label>ГРАФИКА <select id="quality"><option value="low">НИЗКАЯ</option><option value="medium" selected>СРЕДНЯЯ</option><option value="high">ВЫСОКАЯ</option></select></label><label>СКИН AK <select id="skin"><option value="default">DEFAULT</option><option value="redline">REDLINE</option><option value="asimov">ASIMOV</option></select></label></div>
      <button id="play" class="action">В БОЙ <b>›</b></button><button id="fullscreen" class="quiet">⛶ НА ВЕСЬ ЭКРАН</button>
    </section>
    <section id="loading" class="screen hidden"><div class="loading-art"></div><div class="loading-copy"><span class="eyebrow" id="mode-name">КОМАНДНЫЙ БОЙ</span><h2 id="loading-map">SANDSTONE</h2><p id="tip"></p><div class="progress"><i id="progress"></i></div><b id="progress-text">ПОДГОТОВКА 0%</b><div id="countdown"></div></div></section>
    <div id="game"></div>
    <section id="hud" class="hidden">
      <div id="look-zone" aria-label="Зона наведения"></div><div id="move-zone" aria-label="Джойстик"><div id="joystick"><i></i></div></div>
      <div id="vignette"></div><div id="crosshair"><i></i></div><div id="hitmarker">×</div>
      <div class="topbar"><button id="exit" class="hud-small">☰</button><div><b id="score">0</b><small> УБИЙСТВ</small></div><div id="ammo">30 / 90</div></div>
      <div id="feed"></div><div id="toast"></div>
      <button id="left-fire" class="touch fire mini">●</button><button id="fire" class="touch fire">●</button>
      <button id="jump" class="touch utility">↑<small>ПРЫЖОК</small></button><button id="crouch" class="touch utility">⇣<small>ПРИСЕСТЬ</small></button>
      <button id="reload" class="touch utility">↻<small>RELOAD</small></button><button id="inspect" class="touch utility">◉<small>ОСМОТР</small></button><button id="zoom" class="touch utility">⌕<small>ZOOM</small></button>
      <div id="slots"><button data-weapon="knife">НОЖ</button><button data-weapon="glock">GLOCK</button><button data-weapon="ak" class="active">AK-47</button><button data-weapon="awp">AWP</button><button data-weapon="grenade">●</button></div>
      <button id="objective" class="objective hidden">▣ ЗАЛОЖИТЬ C4</button>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
